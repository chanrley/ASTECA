name: astecaweb-infra

services:
  backend:
    container_name: astecaweb-backend
    build:
      context: ..
      dockerfile: INFRA/backend.Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Data Source=/data/asteca.db
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=asteca-api
      - Jwt__ExpiresMinutes=480
    volumes:
      - asteca_db:/data
    networks: [asteca_net]
    restart: unless-stopped

  frontend:
    container_name: astecaweb-frontend
    build:
      context: ..
      dockerfile: INFRA/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks: [asteca_net]
    restart: unless-stopped

volumes:
  asteca_db:

networks:
  asteca_net:
    driver: bridge
